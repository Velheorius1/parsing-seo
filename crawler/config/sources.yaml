  # ── Ebirja встречные аукционные торги (reverse-auction) ──
  # Биржевая сторона ebirja.uz (не госзакупки xarid.ebirja.uz)
  # 2026-04-13: переключен на API (SPA wait_selector "table" таймаутит — API отдаёт {"success":true} без данных)
  # API endpoint обнаружен через Playwright network intercept: fond-api/api/external/auction-product/all
  # 2026-04-17: API responds {success:true} without data — URL verified correct (frontend JS calls same path,
  #   siblings auction-product/get-offers + seller-product/all return {success,meta,data}). No valid anonymous
  #   alternative (list/active/counter-auction all 404; /auction-product/all without 'external' = 401 auth).
  #   Likely transient (no active reverse auctions today). Monitored via zero-result tracker (#6 ok_empty state).
  #   See docs/findings/ebirja-reverse-auction-diagnosis.md
  # ОТКЛЮЧЁН 2026-07-30 — разобрано до конца, «пусто» было ДВУМЯ разными вещами.
  #   (1) Эндпоинт жив и не пуст: 200, meta.totalCount = 59. Ноль в наших логах
  #       давал не сервер, а field_map: он читает name / company_name / price /
  #       end_date, а записи содержат productDetailNameRu, addressRu, amount,
  #       unitTypeNameRu — заголовок выходил пустым, и адаптер отбрасывал всё.
  #   (2) Чинить field_map незачем: это биржевое ТАБЛО СПОТ-ЦЕН на сырьё
  #       (портландцемент, уголь) — ни покупателя, ни дедлайна, ни лота, только
  #       цена за тонну и базис поставки. Спроса на полиграфию тут нет и быть не
  #       может, а 59 строк сырья в день — чистый шум в префильтре.
  #   Реанимировать, только если ebirja откроет закупочную сторону биржи.
  - id: ebirja-reverse-auction
    name: "E-Birja встречные аукционы"
    adapter: api
    enabled: false
    url: "https://api.ebirja.uz/fond-api/api/external/auction-product/all"
    method: GET
    headers:
      Accept: "application/json"
      Referer: "https://ebirja.uz/ru/trade/reverse-auction"
      Origin: "https://ebirja.uz"
    params: {"page": 0, "size": 1000}
    rate_limit: 2.0
    timeout: 15
    id_prefix: "ebirja-ra"
    response_path: "data"
    field_map:
      title: "name"
      organization: "company_name"
      price: "price"
      currency: "UZS"
      deadline: "end_date"
      external_id: "id"
      source_url_template: "https://ebirja.uz/ru/trade/reverse-auction"
    keywords_fields: ["name", "company_name"]

  # ── Ebirja встречные аукционы — листинг ──
  - id: ebirja-reverse-listing
    name: "E-Birja встречный аукцион (листинг)"
    adapter: spa
    enabled: true
    url: "https://ebirja.uz/ru/trade/reverse-listing"
    rate_limit: 0.3
    timeout: 45
    id_prefix: "ebirja-rl"
    wait_selector: "table"
    html_selectors:
      container: "table tbody tr"
      # Live table (7 cols): 1=Тип сделки 2=Номер контракта 3=Наименование товара …
      title: "td:nth-child(3)"
      link: "td:nth-child(3) a"
      # No buyer/price/deadline columns in this commodity-spot listing — omitted.
    field_map:
      currency: "UZS"
      source_url_template: "https://ebirja.uz/ru/trade/reverse-listing"
    keywords_fields: ["title"]

  # ── Ebirja ежедневные объявления торгов ──
  - id: ebirja-announcements
    name: "E-Birja объявления торгов"
    adapter: spa
    enabled: true
    url: "https://ebirja.uz/ru/trade/announcements"
    rate_limit: 0.3
    timeout: 45
    id_prefix: "ebirja-ann"
    wait_selector: "table"
    html_selectors:
      container: "table tbody tr"
      title: "td:nth-child(4)"
      organization: "td:nth-child(6)"
      price: "td:nth-child(8)"
      deadline: "td:nth-child(11)"
      link: "td:nth-child(4) a"
    field_map:
      currency: "UZS"
      source_url_template: "https://ebirja.uz/ru/trade/announcements"
    keywords_fields: ["title"]

  # ── Ebirja authenticated sources (E-IMZO JWT via auth_platform: ebirja) ──
  # 2026-04-17: Added under task #4 (feature-eimzo-reliability). Requires E-IMZO
  # daemon (task #2) to maintain fresh token in session_store under key
  # 'auth_token:ebirja'. If token absent, api.py logs warning and returns [] —
  # zero-result tracker (#6) classifies as skipped_no_auth, not error.
  # id_prefix is ebirja-auth-* (per RISK-4 mitigation: distinct from legacy
  # ebirja-ctr / ebirja-auc to prevent alert-group collision in dedup.py).
  # Field_map follows the public fond-api shape (productDetailNameRu, ptNameRu,
  # mainPrice, id) — same Java backend serves public and authed endpoints.

  # ОТКЛЮЧЁН 2026-06-11: api.ebirja.uz/fond-api/* отдаёт 401 "Full authentication
  # is required" на ВСЕ external/* эндпоинты (fond-api закрыт + источник никогда не давал строк,
  # проверено 11.06 — доступ убран намеренно с переходом на нового оператора
  # xarid.ebirja.uz/ТТСБ ~окт 2025). Источник делал тихие пустые прогоны.
  # Реанимация: либо E-IMZO авторизация app.ebirja.uz, либо discovery нового
  # оператора xarid-api.ebirja.uz (роуты не найдены, отвечает 404).
  - id: ebirja-auth-release-sale
    name: "E-Birja торговые продукты (авторизованный)"
    adapter: api
    enabled: false
    url: "https://api.ebirja.uz/fond-api/api/release-sale/get-trade-products"
    method: GET
    auth_platform: ebirja
    rate_limit: 2.0
    timeout: 15
    id_prefix: "ebirja-auth-rs"
    response_path: "data"
    field_map:
      title: "productDetailNameRu"
      organization: "productLocationRu"
      price: "mainPrice"
      currency: "UZS"
      deadline: ""
      external_id: "id"
      source_url_template: "https://ebirja.uz/ru/trade/release-sale"
    keywords_fields: ["productDetailNameRu", "productLocationRu"]
    pagination:
      type: page
      param: "page"
      size_param: "size"
      page_size: 100
      max_pages: 20
      page_start: 0

