    name: "TG: PR UZB (запросы клиентов)"
    adapter: telegram
    enabled: true
    url: ""
    id_prefix: "tg-pruzb"
    telegram_channel: "@pruzb"
    telegram_limit: 200
    rate_limit: 1.0

  - id: tg-beeline-tenders
    name: "TG: Beeline Tenders"
    adapter: telegram
    enabled: true
    url: ""
    id_prefix: "tg-beel"
    telegram_channel: "@TENDERS_BeelineUZB"
    telegram_limit: 100
    rate_limit: 1.0

  - id: tg-davlatxaridlar
    name: "TG: davlatxaridlar"
    adapter: telegram
    enabled: true
    url: ""
    id_prefix: "tg-davl"
    telegram_channel: "@davlatxaridlar"
    telegram_limit: 100
    rate_limit: 1.0

  - id: tg-tenderweek
    name: "TG: tenderweekcom"
    adapter: telegram
    enabled: true
    url: ""
    id_prefix: "tg-twk"
    telegram_channel: "@tenderweekcom"
    telegram_limit: 100
    rate_limit: 1.0

