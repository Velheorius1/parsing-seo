      # at xarid-api-auctionx.uzex.uz/api/Lot/Get?id={id} — a UI route likely exists.
      # NOT changed automatically: a replacement template must be browser-verified first.
      # (stale) 2026-06-21: browser-verified. Reverse auctions render on the legacy
      # xarid.uzex.uz/auction/detail/{id} route (lot + product table). The
