# Tender sources configuration
# Each source is processed by the adapter matching its 'adapter' type.
# Adapters: api, html, spa, telegram

sources:
  # ── UZEX API sources ──────────────────────────────────────────────

  - id: etender
    name: "ETender UZEX"
    adapter: api
    enabled: true
    url: "https://apietender.uzex.uz/api/Common/TradeList"
    method: POST
    headers:
      Content-Type: "application/json"
    body: {"from": 0, "to": 500}
    rate_limit: 2
    timeout: 15
    id_prefix: "etender"
    field_map:
      title: name
      organization: seller_name
      price: cost
      currency: currency_codeabc
      deadline: end_date
      date_start: start_date
      date_end: end_date
      region: "region_name"
      external_id: display_no
      source_url_template: "https://etender.uzex.uz/lot/{id}"
    keywords_fields: [name, seller_name, category_name]
    pagination:
      type: offset
      param: "from"
      size_param: "to"
      page_size: 500
      total_field: "0.total_count"

  - id: etender-discussion
    name: "ETender Обсуждения"
    adapter: api
    enabled: true
    url: "https://apietender.uzex.uz/api/Common/DiscussionTradeList"
    method: POST
    headers:
      Content-Type: "application/json"
    body: {"from": 0, "to": 500}
    rate_limit: 2
    timeout: 15
    id_prefix: "etender-disc"
    field_map:
      title: name
      organization: seller_name
      price: cost
      currency: currency_codeabc
      deadline: end_date
      date_start: start_date
      date_end: end_date
      region: "region_name"
      external_id: display_no
      source_url_template: "https://etender.uzex.uz/lot/{id}"
    keywords_fields: [name, seller_name, category_name]

  - id: xarid-competitions
    name: "Xarid Конкурсы"
    adapter: api
    enabled: true
    url: "https://xarid-api-purchase.uzex.uz/Common/GetCompetitions"
    method: POST
    headers:
      Content-Type: "application/json"
    body: {"from": 0, "to": 200}
    rate_limit: 5
    timeout: 15
    id_prefix: "competition"
    field_map:
      title: category_name
      organization: ""
      price: cost
      currency: currency_name
      deadline: end_date_submitting_offers
      date_end: end_date_submitting_offers
      region: "customer_region_name"
      external_id: id
      source_url_template: "https://xarid.uzex.uz/competitions/view/{id}"
    keywords_fields: [category_name]
    pagination:
      type: offset
      param: "from"
      size_param: "to"
      page_size: 500
      total_field: "0.total_count"

  - id: xarid-direct
    name: "Xarid Прямые закупки"
    adapter: api
    enabled: true
    url: "https://xarid-api-purchase.uzex.uz/Common/GetDirectPurchases"
    method: POST
    headers:
      Content-Type: "application/json"
    body: {"from": 0, "to": 500}
    rate_limit: 5
    timeout: 15
    id_prefix: "direct"
    field_map:
      title: category_name
      organization: customer_name
      price: contract_sum
      currency: currency_name
      deadline: contract_date
      date_end: contract_date
      external_id: display_id
      source_url_template: "https://xarid.uzex.uz/direct-purchases/view/{id}"
    keywords_fields: [category_name, customer_name, provider_name]

  # ── World Bank API ─────────────────────────────────────────────────

  - id: world-bank
    name: "World Bank"
    adapter: api
    enabled: true
    url: "https://search.worldbank.org/api/v2/procnotices"
    method: GET
    params:
      format: json
      countrycode_exact: UZ
      rows: 200
      os: 0
    rate_limit: 1
    timeout: 15
    id_prefix: "wb"
    response_path: "procnotices"
    country_filter: "Uzbekistan"
    field_map:
      title: project_name
      organization: contact_organization
      price: ""
      currency: ""
      deadline: submission_deadline_date
      date_start: noticedate
      date_end: submission_deadline_date
      region: project_ctry_name
      external_id: bid_reference_no
      source_url_template: "https://projects.worldbank.org/en/projects-operations/procurement-detail/{id}"
    keywords_fields: [project_name, bid_description, notice_text, contact_organization, procurement_group]

  # ── B2Biz.uz — корпоративные закупки (Uzum, частный бизнес) ──────

  - id: b2biz-tenders
    name: "B2Biz.uz (Тендеры)"
    adapter: api
    enabled: true
    url: "https://b2biz.uz/api/v1/etp/get-list-published-procedures/"
    method: GET
    headers:
      Accept: "application/json"
    rate_limit: 1
    timeout: 30
    id_prefix: "b2biz"
    response_path: "results"
    field_map:
      title: ptitle
      organization: psupl
      deadline: deadline
      external_id: guid
      source_url_template: "https://b2biz.uz/home/tenders/{id}"
    keywords_fields: [ptitle, psupl, ptypename]

  - id: b2biz-plans
    name: "B2Biz.uz (Планы закупок)"
    adapter: api
    enabled: true
    url: "https://b2biz.uz/api/v1/etp/plan/proc/list/"
    method: GET
    headers:
      Accept: "application/json"
    rate_limit: 1
    timeout: 30
    id_prefix: "b2biz-plan"
    response_path: "results"
    field_map:
      title: title
      organization: brandname
      deadline: plan_end
      external_id: proc_guid
      source_url_template: "https://b2biz.uz/home/procurement-plans"
    keywords_fields: [title, brandname, description]

  # ── Фаза C: Международные организации (API) ─────────────────────

  - id: grants-usaid
    name: "Grants.gov (USAID)"
    adapter: api
    enabled: true
    url: "https://api.grants.gov/v1/api/search2"
    method: POST
    headers:
      Content-Type: "application/json"
    body:
      keyword: "Uzbekistan"
      oppStatuses: "posted|forecasted"
      rows: 100
      offset: 0
    rate_limit: 2
    timeout: 30
    id_prefix: "grants"
    response_path: "data.oppHits"
    field_map:
      title: title
      organization: agency
      deadline: closeDate
      date_start: openDate
      external_id: number
      source_url_template: "https://www.grants.gov/search-results-detail/{id}"
    keywords_fields: [title, agency, docType]

  - id: sam-gov
    name: "SAM.gov (US Federal)"
    adapter: api
    enabled: false  # Needs free API key — register at sam.gov
    url: "https://api.sam.gov/prod/opportunities/v2/search"
    method: GET
    params:
      api_key: "REPLACE_WITH_KEY"
      limit: 100
      title: "Uzbekistan"
      postedFrom: "01/01/2025"
    rate_limit: 2
    timeout: 30
    id_prefix: "sam"
    response_path: "opportunitiesData"
    field_map:
      title: title
      organization: fullParentPathName
      deadline: responseDeadLine
      date_start: postedDate
      external_id: noticeId
      source_url_template: "https://sam.gov/opp/{id}/view"
    keywords_fields: [title, fullParentPathName, description]

  - id: ted-eu
    name: "TED EU Procurement"
    adapter: api
    enabled: false  # Returns only IDs+links, needs custom adapter for field extraction
    url: "https://api.ted.europa.eu/v3/notices/search"
    method: POST
    headers:
      Content-Type: "application/json"
    body:
      query: "BT-21-Procedure = \"Uzbekistan\""
      fields: ["notice-identifier", "BT-21-Procedure", "organisation-name-buyer", "deadline-receipt-tender-date-lot"]
      limit: 100
    rate_limit: 1
    timeout: 30
    id_prefix: "ted"
    response_path: "notices"
    field_map:
      title: BT-21-Procedure
      organization: organisation-name-buyer
      deadline: deadline-receipt-tender-date-lot
      external_id: publication-number
      source_url_template: "https://ted.europa.eu/en/notice/-/detail/{id}"
    keywords_fields: [BT-21-Procedure, organisation-name-buyer]

  # ── Фаза C: Международные организации (HTML) ─────────────────────

  - id: osce-uz
    name: "OSCE Uzbekistan"
    adapter: html
    enabled: true
    url: "https://procurement.osce.org/tenders?f[]=source:OSCE+Project+Co-ordinator+in+Uzbekistan"
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (compatible; TenderMonitor/1.0)"
    rate_limit: 0.5
    timeout: 20
    id_prefix: "osce"
    html_selectors:
      container: "article.node"
      title: "a"
      deadline: "time"
      link: "a@href"
    field_map:
      title: title
      organization: "OSCE Uzbekistan"
      deadline: deadline
      source_url_template: "https://procurement.osce.org{link}"
    keywords_fields: [title]

  - id: isdb
    name: "Islamic Development Bank (IsDB)"
    adapter: html
    enabled: true
    url: "https://www.isdb.org/project-procurement/tenders"
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (compatible; TenderMonitor/1.0)"
    rate_limit: 0.5
    timeout: 30
    id_prefix: "isdb"
    country_filter: "uzbekistan"
    html_selectors:
      container: "article.teaser.type-tender"
      title: "h2 a"
      deadline: "time"
      link: "a@href"
    field_map:
      title: title
      organization: "IsDB"
      deadline: deadline
      source_url_template: "https://www.isdb.org{link}"
    keywords_fields: [title]

  - id: adb-uz
    name: "Asian Development Bank (ADB)"
    adapter: spa
    enabled: false  # Cloudflare protection — needs Playwright SPA adapter
    url: "https://www.adb.org/projects/tenders/country/uzb"
    rate_limit: 1
    timeout: 30
    id_prefix: "adb"
    field_map:
      title: title
      organization: "ADB"
      deadline: deadline
      source_url_template: "https://www.adb.org{link}"
    keywords_fields: [title]

  - id: aiib
    name: "AIIB (Asian Infrastructure Investment Bank)"
    adapter: html
    enabled: false  # Slow/timeout — needs investigation
    url: "https://www.aiib.org/en/opportunities/business/project-procurement/list.html"
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (compatible; TenderMonitor/1.0)"
    rate_limit: 1
    timeout: 30
    id_prefix: "aiib"
    country_filter: "uzbekistan"
    html_selectors:
      container: "article, .procurement-item"
      title: "h3 a, h2 a"
      deadline: "time, .date"
      link: "a@href"
    field_map:
      title: title
      organization: "AIIB"
      deadline: deadline
      source_url_template: "https://www.aiib.org{link}"
    keywords_fields: [title]

  - id: ebrd
    name: "EBRD Procurement"
    adapter: spa
    enabled: false  # SPA (Delta eSourcing/ECEPP) — needs Playwright + registration
    url: "https://ecepp.ebrd.com"
    rate_limit: 1
    timeout: 30
    id_prefix: "ebrd"
    field_map:
      title: title
      organization: "EBRD"
      deadline: deadline
      source_url_template: "{link}"
    keywords_fields: [title]

  - id: edb-eabr
    name: "Евразийский банк развития (ЕАБР/EDB)"
    adapter: html
    enabled: false  # Needs investigation — UZ recently joined
    url: "https://eabr.org/en/procurement/"
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (compatible; TenderMonitor/1.0)"
    rate_limit: 0.5
    timeout: 20
    id_prefix: "eabr"
    html_selectors:
      container: "article, .procurement-item, .item"
      title: "h3 a, h2 a, a"
      deadline: ".date, time"
      link: "a@href"
    field_map:
      title: title
      organization: "ЕАБР / EDB"
      deadline: deadline
      source_url_template: "https://eabr.org{link}"
    keywords_fields: [title]

  # ── HTML scraping sources ──────────────────────────────────────────

  - id: undp
    name: "UNDP Procurement"
    adapter: html
    enabled: true
    url: "https://procurement-notices.undp.org/"
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (compatible; TenderMonitor/1.0)"
      Accept: "text/html,application/xhtml+xml"
    rate_limit: 0.5
    timeout: 20
    id_prefix: "undp"
    country_filter: "UZB"
    html_selectors:
      container: "a.vacanciesTableLink.vacanciesTable__row"
      title: ".vacanciesTable__cell span:nth-child(1)"
      organization: ".vacanciesTable__cell span:nth-child(3)"
      deadline: ".vacanciesTable__cell span:nth-child(5)"
      link: "@href"
    field_map:
      title: title
      organization: ""
      currency: ""
      deadline: deadline
      external_id: ""
      source_url_template: "https://procurement-notices.undp.org/{link}"
    keywords_fields: [title]

  - id: ungm
    name: "UN Global Marketplace"
    adapter: html
    enabled: true
    url: "https://www.ungm.org/Public/Notice/Search"
    method: POST
    headers:
      Content-Type: "application/json"
      X-Requested-With: "XMLHttpRequest"
      User-Agent: "Mozilla/5.0 (compatible; TenderMonitor/1.0)"
    body:
      PageIndex: 0
      PageSize: 50
      Title: ""
      Description: ""
      Reference: ""
      SortField: "DatePublished"
      SortAscending: false
      isPagingReset: false
      NoticeTypes: []
      UNSPSCs: []
      Countries: []
      Agencies: []
    rate_limit: 0.5
    timeout: 15
    id_prefix: "ungm"
    html_selectors:
      container: "div.tableRow.dataRow[data-noticeid]"
      title: ".ungm-title"
      organization: ".resultAgency span"
      deadline: ".deadline span"
      link: "@data-noticeid"
    field_map:
      title: title
      organization: ""
      currency: ""
      deadline: deadline
      external_id: ""
      source_url_template: "https://www.ungm.org/Public/Notice/{id}"
    keywords_fields: [title]

  - id: uz-airways
    name: "Uzbekistan Airways"
    adapter: html
    enabled: true
    url: "https://corp.uzairways.com/ru/press-center/tenders"
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (compatible; TenderMonitor/1.0)"
      Accept: "text/html,application/xhtml+xml"
      Accept-Language: "ru,uz;q=0.9"
    rate_limit: 0.5
    timeout: 15
    id_prefix: "uzair"
    html_selectors:
      container: ".tender-item"
      title: ".articles__title, .item-title a, h5 a"
      deadline: "time[datetime]@datetime"
      link: "a@href"
    field_map:
      title: title
      organization: ""
      deadline: deadline
      source_url_template: "https://corp.uzairways.com{link}"
    keywords_fields: [title]

  # ── SPA sources (Playwright) ───────────────────────────────────────

  - id: xt-xarid
    name: "xt-xarid.uz"
    adapter: spa
    enabled: true
    url: "https://xt-xarid.uz/procedure/tender"
    rate_limit: 0.5
    timeout: 45
    id_prefix: "xt-xarid"
    wait_selector: ".data-view-item"
    html_selectors:
      container: ".data-view-item"
      title: "a.title"
      organization: ".description span"
      price: "span[style]"
      deadline: ".props time.iac-date"
      link: "a.title"
    keywords_fields: []

  - id: hayotbirja
    name: "Hayot Birja"
    adapter: spa
    enabled: true
    url: "https://hayotbirja.uz/procedure/tender"
    rate_limit: 0.5
    timeout: 45
    id_prefix: "hayot"
    wait_selector: ".data-view-item"
    html_selectors:
      container: ".data-view-item"
      title: "a.title"
      organization: ".description span"
      price: "span[style]"
      deadline: ".props time.iac-date"
      link: "a.title"
    keywords_fields: []

  - id: ebirja-auction
    name: "Ebirja Аукционы"
    adapter: spa
    enabled: true
    url: "https://xarid.ebirja.uz/ru/auction"
    rate_limit: 0.5
    timeout: 45
    id_prefix: "ebirja-auc"
    wait_selector: "article.group"
    html_selectors:
      container: "article.group"
      title: "h4"
      organization: "p.text-v2-grey-80"
      price: ""
      deadline: ""
      link: "a[href*='/auction/']"
    keywords_fields: []

  # ebirja.uz e-shop — PUBLIC REST API (no auth required)
  # Reverse tender: companies list products, competitors bid within 3-4 days
  - id: ebirja-eshop
    name: "Ebirja Электронный магазин"
    adapter: api
    enabled: true
    url: "https://xarid-api.ebirja.uz/shop/product/announce-list"
    method: GET
    params:
      currentPage: 0
      perPage: 500
      platform_display: "e-shop"
    rate_limit: 2
    timeout: 15
    id_prefix: "ebirja-es"
    response_path: "result.data"
    field_map:
      title: title
      organization: ""
      price: unit_price
      currency: "UZS"
      deadline: inactive_date
      external_id: id
      source_url_template: "https://xarid.ebirja.uz/ru/shop/{id}"
    keywords_fields: [title]
    pagination:
      type: page
      param: "currentPage"
      size_param: "perPage"
      page_size: 500
      max_pages: 5

  - id: ebirja-natshop
    name: "Ebirja Национальный магазин"
    adapter: api
    enabled: true
    url: "https://xarid-api.ebirja.uz/shop/product/announce-list"
    method: GET
    params:
      currentPage: 0
      perPage: 500
      platform_display: "national-shop"
    rate_limit: 2
    timeout: 15
    id_prefix: "ebirja-ns"
    response_path: "result.data"
    field_map:
      title: title
      organization: ""
      price: unit_price
      currency: "UZS"
      deadline: inactive_date
      external_id: id
      source_url_template: "https://xarid.ebirja.uz/ru/national-shop/{id}"
    keywords_fields: [title]
    pagination:
      type: page
      param: "currentPage"
      size_param: "perPage"
      page_size: 500
      max_pages: 2

  # cooperation.uz — GEO-BLOCKED from Russian VPS (46.62.155.190)
  # Public REST API found (no auth). Need UZ proxy/VPS to use.
  # API: GET /ocelot/api-client/Client/GetAllPlanSchedule?Skip=0&Take=500
  # Returns 375k procurement plans with productName, companyName, etc.
  - id: cooperation-plans
    name: "Cooperation.uz Закупочные планы"
    adapter: api
    enabled: false  # GEO-BLOCKED: cooperation.uz blocks Russian IPs
    url: "https://new.cooperation.uz/ocelot/api-client/Client/GetAllPlanSchedule"
    method: GET
    params:
      Skip: 0
      Take: 500
    rate_limit: 2
    timeout: 15
    id_prefix: "coop"
    response_path: "result.data"
    field_map:
      title: productName
      organization: companyName
      price: ""
      currency: "UZS"
      deadline: ""
      external_id: id
    keywords_fields: [productName, companyName]

  - id: agro-uzex
    name: "agro.uzex.uz"
    adapter: spa
    enabled: false  # Site times out — unreachable
    url: "https://agro.uzex.uz"
    rate_limit: 0.5
    timeout: 30
    id_prefix: "agro"
    wait_selector: "app-root, .mat-table, [class*=table], [class*=trade]"
    html_selectors:
      container: "tr, .trade-item, .list-item"
      title: "td:nth-child(2), .trade-title, .title"
      organization: "td:nth-child(3), .organization, .seller"
      price: "td:nth-child(4), .price, .cost"
      deadline: "td:nth-child(5), .deadline, .date"
      link: "a[href]"
    keywords_fields: []

  # ── UZEX Обратные аукционы (спрос — покупатель создал лот) ──────

  - id: uzex-auctions
    name: "UZEX Обратные аукционы"
    adapter: api
    enabled: false  # GEO-BLOCKED: 89.236.218.118 blocks Russian VPS. Runs from Mac via fetch_uzex_auctions.py
    url: "https://xarid-api-auctionx.uzex.uz/api/Lot/GetList"
    method: POST
    headers:
      Content-Type: "application/json"
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
    body: {"from": 0, "to": 100}
    rate_limit: 2
    timeout: 15
    id_prefix: "uzex-auc"
    response_path: "Data"
    field_map:
      title: categoryName
      organization: ""
      price: startCost
      currency: "UZS"
      deadline: endDate
      date_end: endDate
      region: regionName
      external_id: id
      source_url_template: "https://xarid.uzex.uz/auction/detail/{id}"
    keywords_fields: [categoryName]

  - id: uzex-prequest
    name: "UZEX Предквалификации"
    adapter: api
    enabled: false  # GEO-BLOCKED: 89.236.218.118 blocks Russian VPS. Runs from Mac via fetch_uzex_auctions.py
    url: "https://xarid-api-prequest.uzex.uz/api/Public/GetLots"
    method: POST
    headers:
      Content-Type: "application/json"
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
    body: {"from": 0, "to": 500}
    rate_limit: 2
    timeout: 15
    id_prefix: "uzex-prq"
    response_path: "Data"
    field_map:
      title: categoryName
      organization: customerName
      price: startCost
      currency: "UZS"
      deadline: endDate
      date_start: startDate
      date_end: endDate
      external_id: id
      source_url_template: "https://xarid.uzex.uz/prequalification/detail/{id}"
    keywords_fields: [categoryName, customerName]
    pagination:
      type: offset
      param: "from"
      size_param: "to"
      page_size: 500
      max_pages: 2

  # ── Telegram каналы ──────────────────────────────────────────────

  # Поставщики/рекламщики/конкуренты + запросы клиентов
  # Keyword-фильтр отсеет спам, оставит релевантные запросы
