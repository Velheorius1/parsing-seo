    url: "https://api.ebirja.uz/fond-api/api/external/seller-product/all"
    method: GET
    rate_limit: 2.0
    timeout: 15
    id_prefix: "ebirja-prod"
    response_path: "data"
    field_map:
      title: "productDetailNameRu"
      # FIX: `ptNameRu` — это тип упаковки ("навал", "в п/п мешках", "картонная коробка"),
      # а не компания-продавец. Публичный seller-product endpoint не возвращает company.
      # Берём адрес продавца в extra_info (productLocationRu) — позволяет идентифицировать
      # продавца по адресу / региону.
      organization: ""
      price: "mainPrice"
      currency: "UZS"
      deadline: ""
      external_id: "id"
      extra_info:
        "Адрес продавца": "productLocationRu"
        "Упаковка": "ptNameRu"
        "Количество": "amount"
        "Ед. изм.": "unitTypeNameRu"
    keywords_fields: ["productDetailNameRu", "productLocationRu"]
    pagination:
      type: page
      param: "page"
      size_param: "size"
      page_size: 100
      max_pages: 20
      page_start: 0

