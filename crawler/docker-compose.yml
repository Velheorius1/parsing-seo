version: "3.8"

services:
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender-crawler
    env_file:
      - .env
    volumes:
      - ./config/sources.yaml:/app/crawler/config/sources.yaml:ro
      - crawler-logs:/var/log
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crawler-logs:
